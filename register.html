<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SMACA</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/register.css">
</head>
<body>
  <div class="auth-container">
    <!-- Left Side - Laptop Mockup -->
    <div class="auth-left">
      <div class="laptop-mockup">
        <img src="assets/laptop-dashboard.png" alt="SMACA Dashboard">
      </div>
      <div class="promo-text">
        <h2>Manage your institution Easily and perfectly !!</h2>
      </div>
    </div>

    <!-- Right Side - Register Form -->
    <div class="auth-right">
      <div class="auth-form-container">
        <div class="logo-section">
          <div class="logo-icon">
            <div class="graduation-cap">
              <div class="tassel"></div>
            </div>
          </div>
          <div class="logo-text">
            <span class="smart">Smart</span> <span class="campus">Campus</span>
          </div>
          <div class="logo-slogan">IoT & AI Platform</div>
        </div>

        <form class="auth-form" id="registerForm">
          <div class="form-field">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
          </div>

          <div class="form-field">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
          </div>

          <div class="form-field">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
          </div>

          <div class="form-field">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm your password" required>
          </div>

          <div class="form-checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn-signup">Sign Up</button>
        </form>

        <div class="signin-link">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>
 
  <script src="assets/js/register.js"></script>
</body>
</html>
